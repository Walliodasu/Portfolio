<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Portfolio personnel">
  <defs>
    <linearGradient id="g-portfolio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="p-portfolio" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#080b12"/>
  <rect width="1200" height="675" fill="url(#g-portfolio)" opacity="0.85"/>
  <rect width="1200" height="675" fill="url(#p-portfolio)"/>
  <circle cx="960" cy="150" r="220" fill="#ffffff" opacity="0.08"/>
  <circle cx="220" cy="560" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Browser window with code motif -->
  <g transform="translate(900,320)" opacity="0.95">
    <rect x="-220" y="-150" width="440" height="300" rx="14" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.7"/>
    <line x1="-220" y1="-100" x2="220" y2="-100" stroke="#ffffff" stroke-width="4" stroke-opacity="0.5"/>
    <circle cx="-190" cy="-125" r="8" fill="#ffffff" opacity="0.6"/>
    <circle cx="-160" cy="-125" r="8" fill="#ffffff" opacity="0.6"/>
    <circle cx="-130" cy="-125" r="8" fill="#ffffff" opacity="0.6"/>
    <text x="-180" y="-20" font-family="ui-monospace, SFMono-Regular, monospace" font-size="60" font-weight="700" fill="#ffffff" opacity="0.9">&lt;/&gt;</text>
    <path d="M-180 40 L-140 40 M-180 70 L-60 70 M-180 100 L-100 100" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-opacity="0.5"/>
  </g>

  <text x="80" y="330" font-family="ui-monospace, SFMono-Regular, monospace" font-size="52" font-weight="600" fill="#ffffff" opacity="0.95">Portfolio</text>
  <text x="80" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#ffffff" opacity="0.75">Angular 20 · SSR · zoneless · signals</text>
</svg>
