<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="MuséeEvasion">
  <defs>
    <linearGradient id="g-museevasion" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <pattern id="p-museevasion" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#080b12"/>
  <rect width="1200" height="675" fill="url(#g-museevasion)" opacity="0.85"/>
  <rect width="1200" height="675" fill="url(#p-museevasion)"/>
  <circle cx="960" cy="150" r="220" fill="#ffffff" opacity="0.08"/>
  <circle cx="220" cy="560" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Museum pediment + map pin motif -->
  <g transform="translate(900,320)" opacity="0.95" stroke="#ffffff" fill="none">
    <path d="M-190 -60 L0 -150 L190 -60 Z" stroke-width="5" stroke-opacity="0.7"/>
    <line x1="-190" y1="-60" x2="-190" y2="130" stroke-width="6" stroke-opacity="0.7"/>
    <line x1="-100" y1="-60" x2="-100" y2="130" stroke-width="6" stroke-opacity="0.5"/>
    <line x1="0" y1="-60" x2="0" y2="130" stroke-width="6" stroke-opacity="0.5"/>
    <line x1="100" y1="-60" x2="100" y2="130" stroke-width="6" stroke-opacity="0.5"/>
    <line x1="190" y1="-60" x2="190" y2="130" stroke-width="6" stroke-opacity="0.7"/>
    <line x1="-210" y1="130" x2="210" y2="130" stroke-width="6" stroke-opacity="0.8"/>
  </g>
  <g transform="translate(1040,180)" fill="#ffffff" opacity="0.85">
    <path d="M0 0 C-34 0 -34 -44 0 -70 C34 -44 34 0 0 0 Z" opacity="0.9"/>
    <circle cx="0" cy="-40" r="12" fill="#080b12"/>
  </g>

  <text x="80" y="300" font-family="ui-monospace, SFMono-Regular, monospace" font-size="50" font-weight="600" fill="#ffffff" opacity="0.95">MuséeEvasion</text>
  <text x="80" y="350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#ffffff" opacity="0.75">Exploration des musées de France</text>
</svg>
