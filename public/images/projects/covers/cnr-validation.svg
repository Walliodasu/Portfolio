<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Validation de vie à distance — CNR">
  <defs>
    <linearGradient id="g-cnr-validation" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="p-cnr-validation" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#080b12"/>
  <rect width="1200" height="675" fill="url(#g-cnr-validation)" opacity="0.85"/>
  <rect width="1200" height="675" fill="url(#p-cnr-validation)"/>
  <circle cx="960" cy="150" r="220" fill="#ffffff" opacity="0.08"/>
  <circle cx="220" cy="560" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- Face recognition / liveness scan motif -->
  <g transform="translate(900,320)" opacity="0.95" stroke="#ffffff" fill="none">
    <path d="M-40 -100 Q-100 -60 -100 0 Q-100 90 -40 130 Q-10 150 0 150 Q10 150 40 130 Q100 90 100 0 Q100 -60 40 -100" stroke-width="5" stroke-opacity="0.7"/>
    <circle cx="-35" cy="-10" r="7" fill="#ffffff" opacity="0.7" stroke="none"/>
    <circle cx="35" cy="-10" r="7" fill="#ffffff" opacity="0.7" stroke="none"/>
    <path d="M-30 55 Q0 80 30 55" stroke-width="4" stroke-opacity="0.6"/>
    <g stroke-width="6" stroke-opacity="0.85">
      <path d="M-150 -140 L-190 -140 L-190 -100"/>
      <path d="M150 -140 L190 -140 L190 -100"/>
      <path d="M-150 180 L-190 180 L-190 140"/>
      <path d="M150 180 L190 180 L190 140"/>
    </g>
  </g>

  <text x="80" y="290" font-family="ui-monospace, SFMono-Regular, monospace" font-size="40" font-weight="600" fill="#ffffff" opacity="0.95">Validation de vie</text>
  <text x="80" y="335" font-family="ui-monospace, SFMono-Regular, monospace" font-size="40" font-weight="600" fill="#ffffff" opacity="0.95">à distance — CNR</text>
  <text x="80" y="380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#ffffff" opacity="0.75">Reconnaissance faciale &amp; vivacité</text>
</svg>
