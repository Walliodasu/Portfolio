@let item = project();

<article
  class="group flex h-full flex-col overflow-hidden rounded-card border border-border-subtle bg-surface-raised transition-all duration-300 hover:-translate-y-1 hover:border-accent-500/50 hover:shadow-xl hover:shadow-accent-500/5"
>
  <a [routerLink]="['/projects', item.slug]" class="relative block aspect-video overflow-hidden">
    <img
      [ngSrc]="item.image.src"
      [width]="item.image.width"
      [height]="item.image.height"
      [alt]="i18n.translate(item.image.alt)"
      [priority]="priority()"
      class="size-full object-cover transition-transform duration-500 group-hover:scale-105"
    />
    <span
      class="absolute top-3 left-3 rounded-full bg-surface/90 px-2.5 py-1 font-mono text-[11px] text-content-muted backdrop-blur-sm"
    >
      {{ i18n.t().projects.categories[item.category] }}
    </span>
  </a>

  <div class="flex flex-1 flex-col p-5">
    <div class="flex items-start justify-between gap-3">
      <h3 class="text-lg font-semibold text-content">
        <a [routerLink]="['/projects', item.slug]" class="hover:text-accent-500">{{
          item.title
        }}</a>
      </h3>
      <span class="shrink-0 font-mono text-xs text-content-faint">{{ item.year }}</span>
    </div>

    <p class="mt-2 line-clamp-2 text-sm leading-relaxed text-content-muted">
      {{ i18n.translate(item.tagline) }}
    </p>

    <ul class="mt-4 flex flex-wrap gap-1.5">
      @for (tech of item.stack.slice(0, 4); track tech) {
        <li><pf-tech-badge [label]="tech" /></li>
      }
      @if (item.stack.length > 4) {
        <li>
          <pf-tech-badge [label]="'+' + (item.stack.length - 4)" />
        </li>
      }
    </ul>

    <a
      [routerLink]="['/projects', item.slug]"
      class="mt-5 inline-flex items-center gap-1.5 self-start text-sm font-medium text-accent-500 transition-colors duration-200 hover:text-accent-400"
    >
      {{ i18n.t().common.viewProject }}
      <pf-icon
        name="arrow-right"
        [size]="16"
        class="transition-transform duration-200 group-hover:translate-x-0.5"
      />
    </a>
  </div>
</article>
