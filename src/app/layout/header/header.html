<header
  class="sticky top-0 z-50 border-b border-border-subtle/70 bg-surface/80 backdrop-blur-lg supports-[backdrop-filter]:bg-surface/70"
>
  <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      class="group flex items-center gap-2 font-mono text-sm font-semibold tracking-tight text-content"
    >
      <span
        class="grid size-8 place-items-center rounded-lg bg-gradient-to-br from-accent-500 to-highlight text-white"
      >
        WT
      </span>
      <span class="hidden sm:inline">{{ profile.fullName }}</span>
    </a>

    <nav class="hidden items-center gap-1 md:flex" [attr.aria-label]="i18n.t().nav.home">
      @for (item of navItems(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-content bg-surface-raised"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="rounded-lg px-3 py-2 text-sm font-medium text-content-muted transition-colors duration-200 hover:bg-surface-raised hover:text-content"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex items-center gap-2">
      <pf-language-toggle />
      <pf-theme-toggle />

      <button
        type="button"
        class="grid size-9 place-items-center rounded-lg border border-border-subtle bg-surface-raised text-content-muted transition-colors duration-200 hover:text-content md:hidden"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="pf-mobile-nav"
        [attr.aria-label]="menuOpen() ? i18n.t().nav.closeMenu : i18n.t().nav.openMenu"
        (click)="toggleMenu()"
      >
        <pf-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="18" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="pf-mobile-nav"
      class="border-t border-border-subtle bg-surface px-4 py-3 md:hidden"
      [attr.aria-label]="i18n.t().nav.openMenu"
    >
      <ul class="flex flex-col gap-1">
        @for (item of navItems(); track item.path) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="text-content bg-surface-raised"
              [routerLinkActiveOptions]="{ exact: item.exact }"
              class="block rounded-lg px-3 py-2.5 text-sm font-medium text-content-muted transition-colors duration-200 hover:bg-surface-raised hover:text-content"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</header>
